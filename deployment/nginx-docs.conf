# Add these locations INSIDE the existing logdog.tech server block.
# They inherit its existing root. Keep the current application/API locations.
# Run nginx -t before reloading. Deployment instructions: deployment/SEO.md.
location = /docs { return 301 /docs/; }
location = /docs/introduction/ { return 301 /docs/; }
location = /robots.txt {
    default_type text/plain;
    try_files $uri =404;
    expires 5m;
}
location = /sitemap.xml {
    default_type application/xml;
    try_files $uri =404;
    expires 5m;
}
location = /sw.js {
    default_type application/javascript;
    try_files $uri =404;
    expires -1;
}
location ^~ /docs/ {
    index index.html;
    # Unknown documentation paths MUST NOT fall back to the app homepage.
    try_files $uri $uri/ =404;
    error_page 404 /docs/404.html;
    expires 5m;
}
